name: Bridge M4 integration checks
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
concurrency:
  group: m4-integration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Record production dependency audit
        continue-on-error: true
        run: npm audit --omit=dev
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BRIDGE_API_BASE: https://bridge-api.example.test
      - name: Install temporary browser test tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx --no-install playwright install --with-deps chromium
      - name: Run synthetic desktop and mobile journeys
        run: npx --no-install playwright test
      - name: Report browser failure context
        if: failure()
        run: |
          python - <<'PY'
          import glob
          for path in glob.glob("/tmp/bridge-m4-test-results/**/error-context.md", recursive=True):
              print(path)
              print(open(path).read()[:9000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-m4-browser-evidence
          path: |
            /tmp/bridge-m4-evidence
            /tmp/bridge-m4-test-results
          if-no-files-found: ignore
  image-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run test:images
  dependency-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve patched dependency candidate without install scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact next@16.4.0 eslint-config-next@16.4.0
      - name: Refresh compatible vulnerable transitive dependencies
        continue-on-error: true
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Emit candidate manifests for review
        run: |
          node --input-type=module - <<'JS'
          import {readFileSync} from 'node:fs';
          for (const file of ['package.json','package-lock.json']) {
            console.log('CANDIDATE_BEGIN ' + file);
            console.log(readFileSync(file,'utf8'));
            console.log('CANDIDATE_END ' + file);
          }
          JS
      - name: Audit candidate production dependencies
        run: npm audit --omit=dev
