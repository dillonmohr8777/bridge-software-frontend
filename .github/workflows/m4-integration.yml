name: Bridge M4 integration checks
on:
  pull_request:
    branches: [development]
permissions:
  contents: read
concurrency:
  group: m4-integration-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_BRIDGE_API_BASE: https://bridge-api.example.test
      - run: npm run test:images
      - name: Install temporary browser test tooling
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx --no-install playwright install --with-deps chromium
      - name: Run synthetic desktop and mobile journeys
        run: npx --no-install playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-m4-browser-evidence
          path: |
            /tmp/bridge-m4-evidence
            /tmp/bridge-m4-test-results
          if-no-files-found: ignore
