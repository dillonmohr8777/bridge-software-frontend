name: Bridge M4 integration checks
on:
  push:
    branches: [feature/m4-source-recovery-20261011]
  pull_request:
    branches: [development]
permissions:
  contents: read
concurrency:
  group: m4-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:images
